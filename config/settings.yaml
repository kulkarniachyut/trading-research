# Trading Research System — configuration
# Secrets (API keys) belong in .env or config/secrets.yaml (both git-ignored), NOT here.

market:
  timezone: "America/New_York"
  session:
    rth_start: "09:30"
    rth_end: "16:00"

# Universe for the first vertical slice — liquid US names = tight spreads, honest fills.
universe:
  - SPY
  - QQQ
  - AAPL
  - MSFT
  - NVDA
  - AMZN
  - META
  - GOOGL
  - TSLA
  - AMD

data:
  provider: "alpaca"            # alpaca (IEX; needs paper keys) | yfinance (free, no keys)
  cache_dir: "data/cache"
  timeframes: ["1m", "5m", "15m", "1h", "1d"]

# Cost assumptions — applied to EVERY fill, grouped by country -> asset class (-> product for
# India equity). The composable cost model (src/backtest/costs) builds the right components per
# market. Statutory rates as of 2025; override per your broker. slippage_atr_mult is what the
# Step-3 cost stress test doubles.
costs:
  default_market:
    country: US
    asset_class: equity
    product: intraday
  US:
    equity:
      half_spread_bps: 1.0
      slippage_atr_mult: 0.05
      commission_per_share: 0.0   # ~$0 (Alpaca)
      commission_min: 0.0
      taf_per_share: 0.000166     # FINRA TAF (sell side, capped)
      taf_cap: 8.30
      sec_per_million: 0.0        # SEC Sec.31 = $0.00/MM since 2025-05-14
  India:
    equity:
      half_spread_bps: 3.0
      slippage_atr_mult: 0.08
      exchange_txn_pct: 0.0000297
      sebi_pct: 0.000001
      gst_rate: 0.18
      delivery:
        stt_delivery: 0.001       # 0.1% buy+sell
        stamp_delivery: 0.00015   # 0.015% buy
        dp_charge: 15.0
      intraday:
        stt_intraday_sell: 0.00025  # 0.025% sell
        stamp_intraday: 0.00003     # 0.003% buy
        brokerage_pct_intraday: 0.0003
        brokerage_cap_intraday: 20.0

risk:
  risk_pct_per_trade: 0.005     # 0.5% of equity risked per trade (off stop distance)
  max_portfolio_heat_pct: 0.02  # cap on total open risk across positions
  max_daily_loss_pct: 0.03      # daily circuit breaker
  max_drawdown_pct: 0.25        # equity-curve circuit breaker

backtest:
  initial_equity: 100000.0
  fill_model: "next_open"       # fill a signal at the next bar's open (no close-of-signal fills)
  straddle_rule: "stop_first"   # if a bar hits both stop and target, assume stop first

validation:
  oos_fraction: 0.30            # tail fraction held out as untouched test
  walkforward:
    train_bars: 5000
    test_bars: 1000
    step_bars: 1000
  montecarlo:
    n_runs: 5000
  guards:
    min_oos_is_sharpe_ratio: 0.60   # flag overfit if OOS Sharpe < 60% of IS
    min_trades: 100
    max_ruin_dd_pct: 0.30

execution:
  broker: "alpaca_paper"
  manual_approval: true         # human-in-the-loop gate ON by default
