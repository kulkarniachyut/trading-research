# Trading Research System — configuration
# Secrets (API keys) belong in .env or config/secrets.yaml (both git-ignored), NOT here.

market:
  timezone: "America/New_York"
  session:
    rth_start: "09:30"
    rth_end: "16:00"

# Universe for the first vertical slice — liquid US names = tight spreads, honest fills.
universe:
  - SPY
  - QQQ
  - AAPL
  - MSFT
  - NVDA
  - AMZN
  - META
  - GOOGL
  - TSLA
  - AMD

data:
  provider: "yfinance"          # yfinance (free, no keys) | alpaca (Step 2+)
  cache_dir: "data/cache"
  timeframes: ["1m", "5m", "15m", "1h", "1d"]

# Cost assumptions — applied to EVERY fill. These are the knobs the cost stress test doubles.
costs:
  commission_per_share: 0.0     # US equities ~ $0
  commission_min: 0.0
  half_spread_bps: 1.0          # half the bid/ask spread, in basis points
  slippage_atr_mult: 0.05       # slippage = mult * ATR (scaled by participation), per fill

risk:
  risk_pct_per_trade: 0.005     # 0.5% of equity risked per trade (off stop distance)
  max_portfolio_heat_pct: 0.02  # cap on total open risk across positions
  max_daily_loss_pct: 0.03      # daily circuit breaker
  max_drawdown_pct: 0.25        # equity-curve circuit breaker

backtest:
  initial_equity: 100000.0
  fill_model: "next_open"       # fill a signal at the next bar's open (no close-of-signal fills)
  straddle_rule: "stop_first"   # if a bar hits both stop and target, assume stop first

validation:
  oos_fraction: 0.30            # tail fraction held out as untouched test
  walkforward:
    train_bars: 5000
    test_bars: 1000
    step_bars: 1000
  montecarlo:
    n_runs: 5000
  guards:
    min_oos_is_sharpe_ratio: 0.60   # flag overfit if OOS Sharpe < 60% of IS
    min_trades: 100
    max_ruin_dd_pct: 0.30

execution:
  broker: "alpaca_paper"
  manual_approval: true         # human-in-the-loop gate ON by default
