[project]
name = "trading-research"
version = "0.1.0"
description = "Backtesting-first, multi-strategy trading research system (truth machine)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",          # Parquet
    "pyyaml>=6.0",            # config
    "pandas-market-calendars>=4.4",  # NYSE sessions / holidays
]

[project.optional-dependencies]
# Installed in later steps so Step 0 stays minimal and fast.
data = [
    "yfinance>=0.2.40",
    "alpaca-py>=0.30",
    # Databento — CME futures (GLBX.MDP3) historical bars: index micros/minis + FX + metals,
    # the two-sided, drift-neutral instruments the ICT 2022 model is actually built for (exp-015).
    "databento>=0.40",
]
indicators = [
    # TA-Lib for classic indicators — modern wheels are self-contained (no system C lib
    # needed). Replaces pandas-ta, which is broken on current numpy/pandas.
    "ta-lib>=0.6",
]
smc = [
    # ICT / smart-money-concepts. It declares only `numba>=0.58.1` (no upper bound), so an
    # unconstrained resolve grabs the newest numba->llvmlite, which has NO macOS-x86_64 wheel and
    # fails building llvmlite from source. Pinning numba to 0.61.x uses llvmlite 0.44 wheels.
    "smartmoneyconcepts>=0.0.27",
    "numba>=0.61,<0.62",
]
stats = [
    "statsmodels>=0.14",  # stat-arb (Step 4)
]
reporting = [
    "streamlit>=1.36",
    "plotly>=5.22",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "network: test hits a live network API (skipped by default; run with -m network)",
    "integration: end-to-end test across real components",
]

[tool.ruff]
line-length = 100
target-version = "py311"
