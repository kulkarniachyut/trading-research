[project]
name = "trading-research"
version = "0.1.0"
description = "Backtesting-first, multi-strategy trading research system (truth machine)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",          # Parquet
    "pyyaml>=6.0",            # config
    "pandas-market-calendars>=4.4",  # NYSE sessions / holidays
]

[project.optional-dependencies]
# Installed in later steps so Step 0 stays minimal and fast.
data = [
    "yfinance>=0.2.40",
    "alpaca-py>=0.30",
]
indicators = [
    # pandas-ta on PyPI is broken on modern numpy/pandas; pinned fork added at Step 2.
    "smartmoneyconcepts>=0.0.20",
    "statsmodels>=0.14",
]
reporting = [
    "streamlit>=1.36",
    "plotly>=5.22",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "network: test hits a live network API (skipped by default; run with -m network)",
    "integration: end-to-end test across real components",
]

[tool.ruff]
line-length = 100
target-version = "py311"
